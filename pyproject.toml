[project]
name = "agent-ops"
version = "0.1.0"
description = "Pre-call briefing agent for FieldAssist Global Account Management"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=0.2",
    "langchain-openai>=0.2",
    "pydantic>=2",
    "python-dotenv>=1",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2",
    "psycopg[binary]>=3.2",
    "grandalf>=0.8",
]

[dependency-groups]
dev = ["ruff>=0.8"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
